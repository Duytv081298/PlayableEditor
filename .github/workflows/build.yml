name: Auto Build PlayableEditor

on:
  push:
    branches:
      - main
    paths:
      - 'playable-editor/src/**'
      - 'playable-editor/scripts/**'
      - 'playable-editor/tests/**'
      - 'playable-editor/index.html'
      - 'playable-editor/package*.json'
      - 'playable-editor/tsconfig*.json'
      - 'playable-editor/vite.config.ts'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Tránh vòng lặp vô hạn khi bot tự commit file build
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playable-editor/package-lock.json

      - name: Install dependencies
        working-directory: playable-editor
        run: npm ci

      - name: Run unit tests
        working-directory: playable-editor
        run: npm test

      - name: Build single-file HTML (PlayableEditor.html) & web bundle
        working-directory: playable-editor
        run: |
          npm run build:single
          npm run build
          cp ../PlayableEditor.html dist/PlayableEditor.html

      - name: Commit updated PlayableEditor.html to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PlayableEditor.html playable-editor/dist-single/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-rebuild PlayableEditor.html [skip ci]"
            git push origin HEAD:main
          else
            echo "PlayableEditor.html is already up to date."
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playable-editor/dist
          cname: ''
